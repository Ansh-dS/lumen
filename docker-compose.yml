services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:  
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lumen_network

  redis:
    image: redis:7-alpine
    container_name: lumen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lumen_network

volumes:
  postgres_data:
  redis_data:

networks:
  lumen_network:
    driver: bridge
